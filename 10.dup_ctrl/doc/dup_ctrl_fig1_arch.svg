<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="aS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
    <style>
      .title { font-size: 16px; font-weight: bold; fill: #0F172A; }
      .dom   { font-size: 13px; font-weight: bold; fill: #475569; }
      .bt    { font-size: 13px; font-weight: bold; fill: #0F172A; }
      .sub   { font-size: 10.5px; fill: #64748B; }
      .txt   { font-size: 10.5px; fill: #334155; }
      .sm    { font-size: 10px; fill: #475569; }
      .cdc   { font-size: 10px; font-weight: bold; fill: #DC2626; }
      .box   { fill: #FFFFFF; stroke: #334155; stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="0" y="0" width="1080" height="720" fill="#FFFFFF"/>
  <text x="540" y="30" class="title" text-anchor="middle">dup_ctrl 顶层结构 — mbus (APB) 接入 · regfile 唯一双域模块 (规则 23)</text>

  <!-- 域背景 -->
  <rect x="16" y="48" width="520" height="560" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-dasharray="6 4"/>
  <text x="28" y="72" class="dom">mbus 域 — APB 桥侧寄存器面 (SW)</text>
  <rect x="556" y="48" width="508" height="560" rx="10" fill="#FFF7ED" stroke="#94A3B8" stroke-dasharray="6 4"/>
  <text x="568" y="72" class="dom">mod_clk 域 — DCLS 比较时钟域</text>
  <line x1="546" y1="48" x2="546" y2="608" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.45"/>
  <text x="546" y="120" class="cdc" text-anchor="middle">CDC 边界</text>

  <!-- mbus 从口 -->
  <rect x="44" y="92" width="300" height="56" rx="6" fill="#FFFFFF" stroke="#475569"/>
  <text x="194" y="113" class="bt" text-anchor="middle">mbus 从口 (APB 桥侧)</text>
  <text x="194" y="132" class="sub" text-anchor="middle" font-size="9.5">ce · wr · addr · wdata · par → rdata · rpar</text>
  <line x1="194" y1="148" x2="194" y2="176" stroke="#475569" stroke-width="1.5" marker-end="url(#aS)"/>

  <!-- regfile 跨域大框 -->
  <rect x="44" y="178" width="836" height="330" rx="8" class="box"/>
  <text x="462" y="202" class="bt" text-anchor="middle">dup_ctrl_regfile — 唯一双域模块 (r_mb + r_mod)</text>
  <text x="462" y="218" class="sub" text-anchor="middle">一切配置 / W1C / REGST 写一次跨域, 两域同施 (image 当拍 + 影子经握手)</text>
  <line x1="56" y1="226" x2="868" y2="226" stroke="#CBD5E1"/>
  <line x1="546" y1="230" x2="546" y2="500" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.45"/>

  <text x="60" y="246" class="txt">· [mbus 域] 译码 / 锁存 / 命令奇偶</text>
  <text x="60" y="266" class="txt">· wr_fire: 锁存 {wsel_q,wdata_q,wpar_q} + 翻 req_t</text>
  <text x="60" y="286" class="txt">· 写锁存奇偶 PERR5 (飞行窗口全程检查)</text>
  <text x="60" y="306" class="txt">· 命令在途奇偶 PERR6 (坏命令拒写 / 读驱 0)</text>
  <text x="60" y="326" class="txt">· image wraps: u_w_en/u_w_ien/u_w_fi/u_w_cmd</text>
  <text x="60" y="346" class="txt">· sta 像: u_err_s2 / u_raw_s2 (s1 = sync_dff)</text>
  <text x="60" y="366" class="txt">· cdc_busy = req_t^ack_s2 → WR_DROPPED 粘滞</text>
  <text x="60" y="386" class="txt">· 忙时到达的合法写 = 丢弃 + WR_DROPPED (STA_CDC)</text>

  <text x="610" y="246" class="txt">· [mod_clk 域] req_edge 译码</text>
  <text x="610" y="266" class="txt">· 锁存 payload (飞行中已静止)</text>
  <text x="610" y="286" class="txt">· key / 码字复检 (双门) → 影子</text>
  <text x="610" y="306" class="txt">· u_c_ena / u_c_ien / u_c_fi wraps</text>
  <text x="610" y="326" class="txt">· err_w1c → u_err_st 清除 (置位优先)</text>
  <text x="610" y="346" class="txt">· 影子 flt W1C / 自测注错 (两域同施)</text>
  <text x="610" y="366" class="txt">· u_err_st 粘滞捕获 (ena 门控 &amp; err_i)</text>
  <text x="610" y="386" class="txt">· fi_o = INJ_EN 开 ? FI 影子 : 00</text>
  <text x="610" y="406" class="txt">· 影子 flt ×4 → 2FF → 回 mbus 聚合</text>
  <text x="610" y="426" class="txt">· u_mod_rst: rst_sync (scan 旁路)</text>

  <line x1="470" y1="446" x2="600" y2="446" stroke="#DC2626" stroke-width="1.8" marker-end="url(#aR)"/>
  <text x="535" y="438" class="cdc" text-anchor="middle">req_t → 2FF → req_edge</text>
  <line x1="600" y1="478" x2="470" y2="478" stroke="#DC2626" stroke-width="1.8" marker-end="url(#aR)"/>
  <text x="535" y="498" class="cdc" text-anchor="middle">ack_t ← (req_edge 拍翻转)</text>

  <!-- ESM 输出 -->
  <rect x="44" y="530" width="280" height="88" rx="8" fill="#FEF2F2" stroke="#F87171"/>
  <text x="184" y="550" class="bt" text-anchor="middle" font-size="12.5">ESM 三轨输出 (mbus 域)</text>
  <text x="184" y="570" class="txt" text-anchor="middle">esm_err / _n = STA_ERR 面 (u_err_s2)</text>
  <text x="184" y="588" class="txt" text-anchor="middle">esm_fault / _n = 自身故障 (0x20 查询)</text>
  <text x="184" y="606" class="txt" text-anchor="middle">reg_par_fault / _n = 寄存器面 PERR</text>
  <line x1="184" y1="508" x2="184" y2="528" stroke="#475569" stroke-width="1.5" marker-end="url(#aS)"/>

  <!-- err_i 入 / fi_o 出 (mod 域) -->
  <line x1="760" y1="556" x2="760" y2="510" stroke="#475569" stroke-width="1.5" marker-end="url(#aS)"/>
  <text x="770" y="538" class="sm">err_i (DCLS err_fusadcls, 同域直入)</text>
  <line x1="980" y1="510" x2="980" y2="556" stroke="#475569" stroke-width="1.5" marker-end="url(#aS)"/>
  <text x="972" y="578" class="sm" text-anchor="end">fi_o → dcls_fault_injection (直连, 01↔10 直切)</text>

  <!-- 图例 -->
  <rect x="16" y="630" width="1048" height="70" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="28" y="650" class="txt">命令跨域 (红 →): wr_fire 锁存 {wsel_q,wdata_q,wpar_q} + req_t 翻转; mod 侧 STAGES-2FF + req_edge 译码 (payload 飞行中静止 ≥STAGES 拍)</text>
  <text x="28" y="668" class="txt">状态回程 (红 ←): ack_t 每 req_edge 拍翻转 · err_st/err_raw 电平 sync_dff+reg_wrap · 影子 flt ×4 sync_2dff 打包回 mbus 聚合 PERR</text>
  <text x="28" y="686" class="txt">复位: rstn 两域共源异步断言 (系统级同时断言对齐握手); mod 域释放经 u_mod_rst (rst_sync, scan_mode 旁路) 对齐 mod_clk</text>
</svg>

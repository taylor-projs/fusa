<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 750" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="aS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font-size: 16px; font-weight: bold; fill: #0F172A; }
      .bt    { font-size: 12.5px; font-weight: bold; fill: #0F172A; }
      .txt   { font-size: 10.5px; fill: #334155; }
      .sub   { font-size: 10px; fill: #64748B; }
      .sm    { font-size: 9.5px; fill: #475569; }
      .box   { fill: #FFFFFF; stroke: #334155; stroke-width: 1.5; }
      .strip { fill: #F8FAFC; stroke: #94A3B8; }
    </style>
  </defs>

  <rect x="0" y="0" width="1080" height="750" fill="#FFFFFF"/>
  <text x="540" y="28" class="title" text-anchor="middle">mode_r 进入/退出/强清逻辑与时序 (hang_prot_recover)</text>

  <!-- ================= Panel A: 逻辑 ================= -->
  <text x="40" y="56" class="bt" text-anchor="start">A. 逻辑: 置位优先于复位 (fail-visible 重触发)</text>

  <rect x="40" y="70" width="320" height="122" rx="8" class="box"/>
  <text x="200" y="90" class="bt" text-anchor="middle">置位 recover_enter (优先)</text>
  <text x="52" y="110" class="txt" text-anchor="start">= ( recover_req (监视器超时脉冲)</text>
  <text x="52" y="127" class="txt" text-anchor="start">   ‖ !sk_integrity (skid 活故障)</text>
  <text x="52" y="144" class="txt" text-anchor="start">   ‖ sl_sw_rst_on (main 复位窗, 电平)</text>
  <text x="52" y="161" class="txt" text-anchor="start">   ‖ int_dis (账本/轨活故障) )</text>
  <text x="52" y="178" class="txt" text-anchor="start">   &amp;&amp; !mode_r</text>

  <rect x="720" y="70" width="320" height="122" rx="8" class="box"/>
  <text x="880" y="90" class="bt" text-anchor="middle">复位 recover_exit (次优先)</text>
  <text x="732" y="110" class="txt" text-anchor="start">= mode_r &amp;&amp; !sl_sw_rst_on &amp;&amp; !int_dis</text>
  <text x="732" y="127" class="txt" text-anchor="start">   &amp;&amp; rd_otd==0 &amp;&amp; wr_otd==0</text>
  <text x="732" y="144" class="txt" text-anchor="start">   &amp;&amp; wsk all_free</text>
  <text x="732" y="168" class="sub" text-anchor="start">账清 ≠ 可退: 还须 main 活 + 无活故障</text>

  <rect x="400" y="80" width="280" height="72" rx="8" class="strip"/>
  <text x="540" y="102" class="bt" text-anchor="middle">mode_r 寄存器 (双轨 mode_r_n)</text>
  <text x="540" y="120" class="txt" text-anchor="middle">if (enter ‖ mode_dis) 1</text>
  <text x="540" y="137" class="txt" text-anchor="middle">else if (exit) 0, else 保持</text>
  <line x1="360" y1="116" x2="400" y2="116" stroke="#475569" stroke-width="1.5" marker-end="url(#aS)"/>
  <text x="380" y="108" class="sm" text-anchor="middle">置1</text>
  <line x1="720" y1="116" x2="680" y2="116" stroke="#475569" stroke-width="1.5" marker-end="url(#aS)"/>
  <text x="700" y="108" class="sm" text-anchor="middle">清0</text>

  <rect x="40" y="208" width="320" height="66" rx="8" class="strip"/>
  <text x="56" y="228" class="bt" text-anchor="start">恢复期通道角色</text>
  <text x="56" y="245" class="sub" text-anchor="start">m 侧: 堵新请求 + dummy R/B 清账</text>
  <text x="56" y="261" class="sub" text-anchor="start">s 侧: 不发新请求 + 吸收迟到 (详 fig5)</text>

  <rect x="400" y="208" width="320" height="66" rx="8" class="strip"/>
  <text x="416" y="228" class="bt" text-anchor="start">s_force (监督强清)</text>
  <text x="416" y="245" class="sub" text-anchor="start">= sl_sw_rst_on &amp;&amp; mode_r &amp;&amp; wr_otd==0</text>
  <text x="416" y="261" class="sub" text-anchor="start">→ wskid force_clear 幂等清环 (粘滞不清)</text>

  <rect x="760" y="208" width="280" height="66" rx="8" class="strip"/>
  <text x="776" y="228" class="bt" text-anchor="start">状态输出 (双轨)</text>
  <text x="776" y="245" class="sub" text-anchor="start">recover_active = mode_r</text>
  <text x="776" y="261" class="sub" text-anchor="start">recover_done  = recover_exit</text>

  <!-- ================= Panel B: 时序 ================= -->
  <text x="40" y="316" class="bt" text-anchor="start">B. 时序: 超时 → 排空卡死 (case 2b) → 契约复位窗 → 放行</text>

  <rect x="140" y="362" width="110" height="336" fill="#ECFDF5" opacity="0.55"/>
  <rect x="250" y="362" width="250" height="336" fill="#FFFBEB" opacity="0.65"/>
  <rect x="500" y="362" width="380" height="336" fill="#FEF2F2" opacity="0.55"/>
  <rect x="880" y="362" width="160" height="336" fill="#ECFDF5" opacity="0.55"/>
  <text x="195" y="380" class="sm" text-anchor="middle">直通</text>
  <text x="375" y="380" class="sm" text-anchor="middle">恢复排空 (dummy 清账)</text>
  <text x="690" y="380" class="sm" text-anchor="middle">复位窗 (main rst 在内)</text>
  <text x="960" y="380" class="sm" text-anchor="middle">回直通</text>

  <line x1="250" y1="386" x2="250" y2="700" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="500" y1="386" x2="500" y2="700" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="880" y1="386" x2="880" y2="700" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="132" y="401" class="txt" text-anchor="end">recover_req</text>
  <polyline points="140,414 250,414 250,396 278,396 278,414 1040,414" fill="none" stroke="#D97706" stroke-width="1.8"/>
  <text x="284" y="399" class="sm" text-anchor="start">r2a/r2r 超时</text>

  <text x="132" y="435" class="txt" text-anchor="end">sl_sw_rst_on</text>
  <polyline points="140,448 500,448 500,430 880,430 880,448 1040,448" fill="none" stroke="#DC2626" stroke-width="1.8"/>
  <text x="496" y="441" class="sm" text-anchor="end">契约: 先拉</text>

  <text x="132" y="469" class="txt" text-anchor="end">main_rst</text>
  <polyline points="140,482 610,482 610,464 750,464 750,482 1040,482" fill="none" stroke="#EA580C" stroke-width="1.8"/>
  <text x="616" y="477" class="sm" text-anchor="start">复位 (忘了在途)</text>
  <text x="756" y="477" class="sm" text-anchor="start">释放→见 5ch idle</text>

  <text x="132" y="503" class="txt" text-anchor="end">mode_r</text>
  <polyline points="140,516 278,516 278,498 908,498 908,516 1040,516" fill="none" stroke="#2563EB" stroke-width="2"/>
  <text x="282" y="495" class="sm" text-anchor="start">T+1 拍寄存置 1</text>
  <text x="914" y="495" class="sm" text-anchor="start">次拍落 0</text>

  <text x="132" y="537" class="txt" text-anchor="end">rd_otd</text>
  <polyline points="140,532 300,532 340,540 380,548 1040,556" fill="none" stroke="#64748B" stroke-width="1.8"/>

  <text x="132" y="571" class="txt" text-anchor="end">wr_otd</text>
  <polyline points="140,566 430,566 470,574 1040,582" fill="none" stroke="#64748B" stroke-width="1.8"/>
  <text x="496" y="600" class="sm" text-anchor="end">REPLAY 卡死 → all_free 不达</text>

  <text x="132" y="605" class="txt" text-anchor="end">all_free</text>
  <polyline points="140,618 660,618 660,600 1040,600" fill="none" stroke="#059669" stroke-width="1.8"/>

  <text x="132" y="639" class="txt" text-anchor="end">s_force</text>
  <polyline points="140,652 660,652 660,634 880,634 880,652 1040,652" fill="none" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="690" y="630" class="sm" text-anchor="end">账清 ∧ 复位窗 → 幂等清环</text>

  <text x="132" y="673" class="txt" text-anchor="end">recover_exit</text>
  <polyline points="140,686 880,686 880,668 908,668 908,686 1040,686" fill="none" stroke="#0D9488" stroke-width="1.8"/>
  <text x="874" y="668" class="sm" text-anchor="end">sl_sw_rst_on 撤同拍成立</text>

  <line x1="140" y1="700" x2="1040" y2="700" stroke="#334155" stroke-width="1.2"/>
  <line x1="140" y1="696" x2="140" y2="704" stroke="#334155" stroke-width="1.2"/>
  <text x="140" y="718" class="sm" text-anchor="middle">T0</text>
  <line x1="250" y1="696" x2="250" y2="704" stroke="#334155" stroke-width="1.2"/>
  <text x="250" y="718" class="sm" text-anchor="middle">T1</text>
  <line x1="500" y1="696" x2="500" y2="704" stroke="#334155" stroke-width="1.2"/>
  <text x="500" y="718" class="sm" text-anchor="middle">T3</text>
  <line x1="610" y1="696" x2="610" y2="704" stroke="#334155" stroke-width="1.2"/>
  <text x="610" y="718" class="sm" text-anchor="middle">T4</text>
  <line x1="750" y1="696" x2="750" y2="704" stroke="#334155" stroke-width="1.2"/>
  <text x="750" y="718" class="sm" text-anchor="middle">T5</text>
  <line x1="880" y1="696" x2="880" y2="704" stroke="#334155" stroke-width="1.2"/>
  <text x="880" y="718" class="sm" text-anchor="middle">T6</text>
  <line x1="908" y1="696" x2="908" y2="704" stroke="#334155" stroke-width="1.2"/>
  <text x="908" y="718" class="sm" text-anchor="middle">T6+1</text>

  <text x="140" y="740" class="sub" text-anchor="start">契约: sl_sw_rst_on 先于 main 复位拉起, main 释放后才撤 (ESM 握钥匙, 双轨驱动); mode_r 跳变永远晚事件一拍 (寄存无毛刺)</text>
</svg>

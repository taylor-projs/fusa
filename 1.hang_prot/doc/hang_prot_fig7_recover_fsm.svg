<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="aS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font-size: 16px; font-weight: bold; fill: #0F172A; }
      .bt    { font-size: 13px; font-weight: bold; fill: #0F172A; }
      .txt   { font-size: 10.5px; fill: #334155; }
      .sub   { font-size: 10.5px; fill: #64748B; }
      .box   { fill: #FFFFFF; stroke: #334155; stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="0" y="0" width="720" height="190" fill="#FFFFFF"/>
  <text x="360" y="28" class="title" text-anchor="middle">恢复状态机</text>

  <rect x="80" y="66" width="180" height="56" rx="28" class="box"/>
  <text x="170" y="90" class="bt" text-anchor="middle">NORMAL</text>
  <text x="170" y="110" class="sub" text-anchor="middle">(直通+重映射)</text>

  <rect x="460" y="66" width="180" height="56" rx="28" class="box"/>
  <text x="550" y="90" class="bt" text-anchor="middle">RECOVER</text>
  <text x="550" y="110" class="sub" text-anchor="middle">(mode_r=1, 自保持)</text>

  <line x1="260" y1="82" x2="460" y2="82" stroke="#475569" stroke-width="1.5" marker-end="url(#aS)"/>
  <text x="360" y="70" class="txt" text-anchor="middle">recover_req (脉冲)</text>

  <line x1="460" y1="108" x2="260" y2="108" stroke="#475569" stroke-width="1.5" marker-end="url(#aS)"/>
  <text x="360" y="126" class="txt" text-anchor="middle">四本账全零</text>
</svg>

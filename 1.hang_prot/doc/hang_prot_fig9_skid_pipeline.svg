<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 290" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <style>
      .title { font-size: 16px; font-weight: bold; fill: #0F172A; }
      .bt    { font-size: 11px; font-weight: bold; fill: #0F172A; }
      .txt   { font-size: 10.5px; fill: #334155; }
      .sm    { font-size: 10px; fill: #475569; }
      .ruler { font-size: 10px; fill: #64748B; }
    </style>
  </defs>

  <rect x="0" y="0" width="1020" height="290" fill="#FFFFFF"/>
  <text x="510" y="26" class="title" text-anchor="middle">双 slot 流水重叠 — 写占空 ~100%</text>

  <!-- 拍标尺与网格 -->
  <text x="160" y="52" class="ruler">1</text>
  <text x="274" y="52" class="ruler">2 …</text>
  <text x="388" y="52" class="ruler">B</text>
  <text x="502" y="52" class="ruler">B+1</text>
  <text x="616" y="52" class="ruler">B+2 …</text>
  <text x="730" y="52" class="ruler">2B</text>
  <text x="844" y="52" class="ruler">2B+1</text>
  <text x="958" y="52" class="ruler" text-anchor="end">2B+2 …</text>
  <line x1="160" y1="60" x2="160" y2="256" stroke="#E2E8F0" stroke-dasharray="4 4"/>
  <line x1="274" y1="60" x2="274" y2="256" stroke="#E2E8F0" stroke-dasharray="4 4"/>
  <line x1="388" y1="60" x2="388" y2="256" stroke="#E2E8F0" stroke-dasharray="4 4"/>
  <line x1="502" y1="60" x2="502" y2="256" stroke="#E2E8F0" stroke-dasharray="4 4"/>
  <line x1="616" y1="60" x2="616" y2="256" stroke="#E2E8F0" stroke-dasharray="4 4"/>
  <line x1="730" y1="60" x2="730" y2="256" stroke="#E2E8F0" stroke-dasharray="4 4"/>
  <line x1="844" y1="60" x2="844" y2="256" stroke="#E2E8F0" stroke-dasharray="4 4"/>
  <line x1="958" y1="60" x2="958" y2="256" stroke="#E2E8F0" stroke-dasharray="4 4"/>

  <!-- m 侧 W lane -->
  <text x="70" y="90" class="bt">m 侧 W(不断流)</text>
  <rect x="160" y="76" width="228" height="26" fill="#86EFAC" stroke="#16A34A"/>
  <text x="274" y="94" class="txt" text-anchor="middle">填 slot0 (B 拍)</text>
  <rect x="502" y="76" width="228" height="26" fill="#86EFAC" stroke="#16A34A"/>
  <text x="616" y="94" class="txt" text-anchor="middle">填 slot1 (B 拍)</text>
  <rect x="844" y="76" width="114" height="26" fill="#86EFAC" stroke="#16A34A"/>
  <text x="901" y="94" class="txt" text-anchor="middle">填 slot2 …</text>

  <!-- s 侧 W lane -->
  <text x="70" y="140" class="bt">s 侧 W(不断流)</text>
  <text x="331" y="144" class="sm" text-anchor="middle">(静默等 AW 攒齐)</text>
  <rect x="502" y="126" width="228" height="26" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="616" y="144" class="txt" text-anchor="middle">放 slot0 (B 拍)</text>
  <rect x="844" y="126" width="114" height="26" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="901" y="144" class="txt" text-anchor="middle">放 slot1 …</text>

  <!-- slot0 lane -->
  <text x="70" y="194" class="bt">slot0</text>
  <rect x="160" y="176" width="60" height="26" fill="#E2E8F0" stroke="#94A3B8"/>
  <text x="190" y="194" class="txt" text-anchor="middle">FREE</text>
  <rect x="220" y="176" width="168" height="26" fill="#FEF9C3" stroke="#CA8A04"/>
  <text x="304" y="194" class="txt" text-anchor="middle">FILL</text>
  <rect x="388" y="176" width="114" height="26" fill="#FDE68A" stroke="#D97706"/>
  <text x="445" y="194" class="txt" text-anchor="middle">READY</text>
  <rect x="502" y="176" width="228" height="26" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="616" y="194" class="txt" text-anchor="middle">REPLAY</text>
  <rect x="730" y="176" width="60" height="26" fill="#E2E8F0" stroke="#94A3B8"/>
  <text x="760" y="194" class="txt" text-anchor="middle">FREE</text>
  <text x="800" y="194" class="sm">…</text>

  <!-- slot1 lane -->
  <text x="70" y="244" class="bt">slot1</text>
  <rect x="274" y="226" width="60" height="26" fill="#E2E8F0" stroke="#94A3B8"/>
  <text x="304" y="244" class="txt" text-anchor="middle">FREE</text>
  <rect x="334" y="226" width="168" height="26" fill="#FEF9C3" stroke="#CA8A04"/>
  <text x="418" y="244" class="txt" text-anchor="middle">FILL</text>
  <rect x="502" y="226" width="114" height="26" fill="#FDE68A" stroke="#D97706"/>
  <text x="559" y="244" class="txt" text-anchor="middle">READY</text>
  <rect x="616" y="226" width="228" height="26" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="730" y="244" class="txt" text-anchor="middle">REPLAY</text>
  <text x="854" y="244" class="sm">…</text>

  <text x="70" y="276" class="sm">slot0 在 REPLAY 时 slot1 已在 FILL — 两条 W 通道各跑各的, 占空由下游 wready 决定, 不再由 skid 结构决定</text>
</svg>

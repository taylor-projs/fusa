<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="aS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
    <style>
      .title { font-size: 16px; font-weight: bold; fill: #0F172A; }
      .dom   { font-size: 13px; font-weight: bold; fill: #475569; }
      .bt    { font-size: 12.5px; font-weight: bold; fill: #0F172A; }
      .txt   { font-size: 10.5px; fill: #334155; }
      .sm    { font-size: 10px; fill: #475569; }
      .cdc   { font-size: 10px; font-weight: bold; fill: #DC2626; }
      .box   { fill: #FFFFFF; stroke: #334155; stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="0" y="0" width="1080" height="560" fill="#FFFFFF"/>
  <text x="540" y="30" class="title" text-anchor="middle">axi2sram_ctrl_regfile — mbus_clk / axi_clk 双时钟域 CDC 结构 (§2)</text>

  <!-- 域背景 -->
  <rect x="16" y="56" width="464" height="414" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-dasharray="6 4"/>
  <text x="28" y="80" class="dom">mbus_clk 域</text>
  <rect x="600" y="56" width="464" height="414" rx="10" fill="#FFF7ED" stroke="#94A3B8" stroke-dasharray="6 4"/>
  <text x="612" y="80" class="dom">axi_clk 域 (引擎)</text>
  <line x1="540" y1="56" x2="540" y2="470" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.45"/>
  <text x="540" y="108" class="cdc" text-anchor="middle">CDC 边界</text>

  <!-- mbus leaf 从机 -->
  <rect x="98" y="92" width="300" height="48" rx="8" class="box"/>
  <text x="248" y="112" class="bt" text-anchor="middle">mbus leaf 从机</text>
  <text x="248" y="130" class="sm" text-anchor="middle">ce &#183; wr &#183; addr &#183; wdata &#183; par &#8594; rdata &#183; rpar</text>
  <line x1="248" y1="140" x2="248" y2="160" stroke="#475569" stroke-width="1.5" marker-end="url(#aS)"/>

  <!-- 写锁存 -->
  <rect x="98" y="164" width="300" height="42" rx="8" class="box"/>
  <text x="248" y="189" class="txt" text-anchor="middle" font-weight="bold">写锁存 {wsel_q, wdata_q, wpar_q}</text>
  <line x1="248" y1="206" x2="248" y2="218" stroke="#475569" stroke-width="1.5" marker-end="url(#aS)"/>

  <!-- 命令在途奇偶 -->
  <rect x="98" y="222" width="300" height="56" rx="8" class="box"/>
  <text x="248" y="244" class="txt" text-anchor="middle">命令在途奇偶 ^{addr,wr,wdata} &#8594; PERR_CMD</text>
  <text x="248" y="264" class="txt" text-anchor="middle">坏奇偶: 写阻断 &#183; 读门控 0 (W=1 wrap)</text>
  <line x1="248" y1="278" x2="248" y2="296" stroke="#475569" stroke-width="1.5" marker-end="url(#aS)"/>

  <!-- 2FF 回同步 -->
  <rect x="98" y="300" width="300" height="42" rx="8" class="box"/>
  <text x="248" y="325" class="txt" text-anchor="middle" font-weight="bold">2FF 同步回 mbus_clk (ack_t_s2)</text>
  <line x1="248" y1="342" x2="248" y2="358" stroke="#475569" stroke-width="1.5" marker-end="url(#aS)"/>

  <!-- STA_CDC -->
  <rect x="98" y="362" width="300" height="56" rx="8" class="box"/>
  <text x="248" y="384" class="txt" text-anchor="middle">STA_CDC[0] CFG_BUSY (依赖写前 poll)</text>
  <text x="248" y="404" class="txt" text-anchor="middle">[1] WR_DROPPED 忙丢粘滞 (W1C)</text>
  <line x1="248" y1="418" x2="248" y2="430" stroke="#475569" stroke-width="1.5" marker-end="url(#aS)"/>

  <!-- rdata -->
  <rect x="98" y="434" width="300" height="32" rx="8" class="box"/>
  <text x="248" y="454" class="txt" text-anchor="middle" font-weight="bold">rdata &#183; rpar 组合读返回 (零等待)</text>

  <!-- axi 侧: 2FF + 边沿检测 -->
  <rect x="662" y="170" width="340" height="42" rx="8" class="box"/>
  <text x="832" y="190" class="txt" text-anchor="middle" font-weight="bold">2FF 同步 + 边沿检测 &#8594; req_edge</text>
  <text x="832" y="205" class="sm" text-anchor="middle">(axi_clk)</text>
  <line x1="832" y1="212" x2="832" y2="232" stroke="#475569" stroke-width="1.5" marker-end="url(#aS)"/>

  <!-- req_edge 译码执行 -->
  <rect x="662" y="236" width="340" height="42" rx="8" class="box"/>
  <text x="832" y="261" class="txt" text-anchor="middle" font-weight="bold">req_edge 译码 &#183; 影子 reg_wrap 载入</text>
  <line x1="832" y1="278" x2="832" y2="294" stroke="#475569" stroke-width="1.5" marker-end="url(#aS)"/>

  <!-- 引擎 -->
  <rect x="662" y="296" width="340" height="60" rx="8" class="box"/>
  <text x="832" y="318" class="bt" text-anchor="middle">引擎 axi2sram_ctrl_core</text>
  <text x="832" y="338" class="sm" text-anchor="middle">BYPASS/INIT/自测影子 &#183; W1C &#183; 事件/计数器</text>

  <!-- CDC 红箭头: req_t / ack_t / 回程 -->
  <line x1="398" y1="196" x2="660" y2="196" stroke="#DC2626" stroke-width="1.8" marker-end="url(#aR)"/>
  <text x="530" y="184" class="cdc" text-anchor="middle">req_t (toggle)</text>
  <line x1="662" y1="258" x2="400" y2="258" stroke="#DC2626" stroke-width="1.8" marker-end="url(#aR)"/>
  <text x="530" y="246" class="cdc" text-anchor="middle">ack_t (toggle)</text>
  <polyline points="832,356 832,430 400,430" fill="none" stroke="#DC2626" stroke-width="1.8" marker-end="url(#aR)"/>
  <text x="560" y="418" class="cdc" text-anchor="middle">状态/事件 · 计数器 (sync_dff+reg_wrap / 2FF)</text>

  <!-- 图例 -->
  <rect x="16" y="484" width="1048" height="60" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="28" y="504" class="txt">红 &#8594; 写路径: 写当拍锁存 {wsel,wdata,wpar} + 翻 req_t; axi 域 2FF+边沿得 req_edge, 影子 reg_wrap 载入 (两域同施), 翻 ack_t 应答; 在途期间 CFG_BUSY=1</text>
  <text x="28" y="524" class="txt">红 &#8592; 读/回程: 状态&#183;事件 = sync_dff 首级 + reg_wrap 第二级; 计数器 = sync_2dff 诊断副本; rdata 零等待组合返回 + rpar 无条件驱动; W1C/REGST 解码随命令跨域两域同施</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="fS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <marker id="fG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="fR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
    <marker id="fV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/>
    </marker>
    <style>
      .title { font-size: 17px; font-weight: bold; fill: #0F172A; }
      .lane  { font-size: 12.5px; font-weight: bold; fill: #475569; }
      .bt    { font-size: 12px; font-weight: bold; fill: #0F172A; }
      .txt   { font-size: 10.5px; fill: #334155; }
      .sm    { font-size: 9.5px; fill: #475569; }
      .data  { font-size: 9.5px; font-weight: bold; fill: #2563EB; }
      .box   { fill: #FFFFFF; stroke: #334155; stroke-width: 1.5; }
      .datbx { fill: #EFF6FF; stroke: #2563EB; }
      .engbx { fill: #F8FAFC; stroke: #64748B; }
      .respb { fill: #ECFDF5; stroke: #059669; }
      .errb  { fill: #FEF2F2; stroke: #DC2626; }
    </style>
  </defs>

  <rect x="0" y="0" width="1080" height="700" fill="#FFFFFF"/>
  <text x="540" y="30" class="title" text-anchor="middle">AXI 写全流程 — AW/W → 行引擎 → B (数据路 蓝 / 控制路 灰 / 响应 绿)</text>

  <!-- ============ Lane 1: AW 命令路 (控制) ============ -->
  <text x="30" y="80" class="lane">AW 命令路</text>
  <text x="30" y="96" class="sm">(控制)</text>
  <rect x="150" y="58" width="180" height="50" rx="6" class="box"/>
  <text x="240" y="77" class="bt" text-anchor="middle">AW 握手接受</text>
  <text x="240" y="95" class="sm" text-anchor="middle">id/addr/len/size/burst</text>

  <rect x="370" y="58" width="200" height="50" rx="6" class="box"/>
  <text x="470" y="77" class="bt" text-anchor="middle">命令载荷拼装</text>
  <text x="470" y="94" class="sm" text-anchor="middle">{user,lock,id,len,resp}</text>

  <rect x="610" y="58" width="190" height="50" rx="6" class="box"/>
  <text x="705" y="77" class="bt" text-anchor="middle">独占写首拍评估</text>
  <text x="705" y="94" class="sm" text-anchor="middle">监视器匹配 → EXOKAY/OKAY</text>

  <rect x="850" y="58" width="200" height="50" rx="6" class="engbx"/>
  <text x="950" y="77" class="bt" text-anchor="middle">入队 4 深·帽 5</text>
  <text x="950" y="94" class="sm" text-anchor="middle">按到达序 (AW/AR 共队列)</text>

  <line x1="330" y1="83" x2="366" y2="83" stroke="#475569" stroke-width="1.5" marker-end="url(#fG)"/>
  <line x1="570" y1="83" x2="606" y2="83" stroke="#475569" stroke-width="1.5" marker-end="url(#fG)"/>
  <line x1="800" y1="83" x2="846" y2="83" stroke="#475569" stroke-width="1.5" marker-end="url(#fG)"/>

  <!-- ============ Lane 2: W 数据路 ============ -->
  <text x="30" y="170" class="lane">W 数据路</text>
  <text x="30" y="186" class="sm">(数据)</text>
  <rect x="150" y="148" width="180" height="50" rx="6" class="box"/>
  <text x="240" y="167" class="bt" text-anchor="middle">W 握手接受</text>
  <text x="240" y="185" class="sm" text-anchor="middle">wdata 256b + wstrb + wlast</text>

  <rect x="370" y="148" width="200" height="50" rx="6" class="datbx"/>
  <text x="470" y="167" class="bt" text-anchor="middle">wskip 2 深 (fifo_sync)</text>
  <text x="470" y="185" class="sm" text-anchor="middle">W 可先于 AW (AXI4 合法)</text>

  <rect x="610" y="148" width="190" height="50" rx="6" class="datbx"/>
  <text x="705" y="167" class="bt" text-anchor="middle">拍对齐 head 命令</text>
  <text x="705" y="185" class="sm" text-anchor="middle">按 bidx 逐拍 → cur_ws/cur_wd</text>

  <line x1="330" y1="173" x2="366" y2="173" stroke="#2563EB" stroke-width="1.8" marker-end="url(#fS)"/>
  <line x1="570" y1="173" x2="606" y2="173" stroke="#2563EB" stroke-width="1.8" marker-end="url(#fS)"/>
  <line x1="800" y1="173" x2="930" y2="173" stroke="#2563EB" stroke-width="1.8" marker-end="url(#fS)" stroke-dasharray="5 3"/>
  <text x="865" y="166" class="data" text-anchor="middle">数据拍按序供引擎</text>

  <!-- ============ Lane 3: 行引擎数据面 ============ -->
  <text x="30" y="290" class="lane">行引擎</text>
  <text x="30" y="306" class="sm">(数据面)</text>
  <rect x="150" y="252" width="130" height="88" rx="6" class="engbx"/>
  <text x="215" y="272" class="bt" text-anchor="middle">S_IDLE 分派</text>
  <text x="215" y="290" class="sm" text-anchor="middle">head 出队</text>
  <text x="215" y="304" class="sm" text-anchor="middle">wcnt&gt;0 起写</text>
  <text x="215" y="318" class="sm" text-anchor="middle">空写拍跳过宏</text>

  <rect x="320" y="252" width="150" height="40" rx="6" fill="#ECFDF5" stroke="#059669"/>
  <text x="395" y="269" class="txt" text-anchor="middle" font-weight="bold">整行写 (strb 全 1)</text>
  <text x="395" y="284" class="sm" text-anchor="middle">wrapper 编码 → 1 拍/行</text>

  <rect x="320" y="300" width="150" height="40" rx="6" fill="#ECFDF5" stroke="#059669"/>
  <text x="395" y="317" class="txt" text-anchor="middle" font-weight="bold">bypass 部分写直写</text>
  <text x="395" y="332" class="sm" text-anchor="middle">bw=strb → 1 拍/行</text>

  <rect x="510" y="252" width="170" height="88" rx="6" fill="#FFF7ED" stroke="#EA580C"/>
  <text x="595" y="272" class="txt" text-anchor="middle" font-weight="bold">FuSa 部分写 RMW = 2 拍</text>
  <text x="595" y="290" class="sm" text-anchor="middle">拍1 读旧行 (wrapper 译码)</text>
  <text x="595" y="304" class="sm" text-anchor="middle">字节合并 (CERR 纠后并)</text>
  <text x="595" y="318" class="sm" text-anchor="middle">拍2 重编码写回 (顺带洗刷)</text>
  <text x="595" y="332" class="sm" text-anchor="middle">DERR 读拍上报 · 重编码洗净</text>

  <rect x="720" y="252" width="140" height="88" rx="6" class="errb"/>
  <text x="790" y="272" class="txt" text-anchor="middle" font-weight="bold">独占失败排空</text>
  <text x="790" y="290" class="sm" text-anchor="middle">独占失败:</text>
  <text x="790" y="304" class="sm" text-anchor="middle">W 拍照收不碰宏</text>
  <text x="790" y="318" class="sm" text-anchor="middle">B 空挂 (OKAY)</text>
  <text x="790" y="332" class="sm" text-anchor="middle">失败不写不清监视器</text>

  <line x1="280" y1="272" x2="316" y2="272" stroke="#2563EB" stroke-width="1.8" marker-end="url(#fS)"/>
  <line x1="280" y1="320" x2="316" y2="320" stroke="#2563EB" stroke-width="1.8" marker-end="url(#fS)"/>
  <line x1="280" y1="296" x2="506" y2="296" stroke="#2563EB" stroke-width="1.8" marker-end="url(#fS)"/>
  <line x1="280" y1="330" x2="716" y2="330" stroke="#475569" stroke-width="1.5" marker-end="url(#fG)" stroke-dasharray="5 3"/>

  <!-- 宏写口 -->
  <rect x="900" y="252" width="150" height="88" rx="6" class="datbx"/>
  <text x="975" y="272" class="bt" text-anchor="middle">宏写口 (wrapper 驱动)</text>
  <text x="975" y="290" class="sm" text-anchor="middle">csn=0, wen=1 采样</text>
  <text x="975" y="304" class="sm" text-anchor="middle">wdata 274b = 行</text>
  <text x="975" y="318" class="sm" text-anchor="middle">bw 数据场 + we_ecc</text>
  <text x="975" y="332" class="sm" text-anchor="middle">写 0 拍</text>
  <line x1="470" y1="272" x2="896" y2="272" stroke="#2563EB" stroke-width="1.8" marker-end="url(#fS)"/>
  <line x1="470" y1="320" x2="896" y2="320" stroke="#2563EB" stroke-width="1.8" marker-end="url(#fS)"/>
  <line x1="690" y1="296" x2="896" y2="296" stroke="#2563EB" stroke-width="1.8" marker-end="url(#fS)"/>

  <!-- ============ Lane 4: B 响应路 ============ -->
  <text x="30" y="412" class="lane">B 响应路</text>
  <text x="30" y="428" class="sm">(控制)</text>
  <rect x="150" y="388" width="180" height="50" rx="6" class="box"/>
  <text x="240" y="407" class="bt" text-anchor="middle">last_fire (wlast 拍)</text>
  <text x="240" y="425" class="sm" text-anchor="middle">命令出队, head+1, cnt-1</text>

  <rect x="370" y="388" width="200" height="50" rx="6" class="respb"/>
  <text x="470" y="407" class="bt" text-anchor="middle">bskip 4 深缓冲 (v3.8)</text>
  <text x="470" y="425" class="sm" text-anchor="middle">{resp,user,id} bready 弹出</text>

  <rect x="610" y="388" width="250" height="50" rx="6" class="respb"/>
  <text x="735" y="407" class="bt" text-anchor="middle">BRESP 按命令序</text>
  <text x="735" y="425" class="sm" text-anchor="middle">OKAY / EXOKAY(独占成)</text>

  <line x1="330" y1="413" x2="366" y2="413" stroke="#059669" stroke-width="1.8" marker-end="url(#fR)"/>
  <line x1="570" y1="413" x2="606" y2="413" stroke="#059669" stroke-width="1.8" marker-end="url(#fR)"/>

  <!-- 队列 → 引擎 / 引擎 → B 垂直连接 -->
  <line x1="950" y1="108" x2="950" y2="248" stroke="#475569" stroke-width="1.5" marker-end="url(#fG)"/>
  <text x="960" y="180" class="sm">head 指针</text>
  <line x1="215" y1="340" x2="215" y2="384" stroke="#475569" stroke-width="1.5" marker-end="url(#fG)"/>
  <text x="735" y="460" class="sm" text-anchor="middle">响应不重排: 单队列按序交付 (AXI4 同 ID 保序天然满足)</text>

  <!-- ============ 关键细节注记 ============ -->
  <rect x="30" y="500" width="1020" height="170" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="46" y="524" class="bt">写路径关键语义</text>
  <text x="46" y="548" class="txt">· WSTRB 字节粒度权威: 整行 (全 1) → 编码直写 1 拍; 部分写 → FuSa 走 RMW 2 拍 (读-译码-合并-编码-写), bypass 走 bw 直写 1 拍</text>
  <text x="46" y="568" class="txt">· wskip 与队列解耦: W 拍只认 wlast 边界, 与 AW 到达序无关 (W-first 合法); 引擎按 head 命令的 bidx 对齐取拍</text>
  <text x="46" y="588" class="txt">· 引擎不预取不重排: 一条命令逐拍处理完 (last_fire) 才下一条 → 写响应天然按到达序; 队列 4 深 (帽 5) wskip=2 覆盖 NIC 两条整行突发</text>
  <text x="46" y="608" class="txt">· 独占写在首拍评估: fail → 整条 skip 排空 (不写宏, B=OKAY); 成功 → 正常写 + B=EXOKAY; 任何写落监视器行即清监视器</text>
  <text x="46" y="628" class="txt">· 空写拍 (strb=0) 合法消耗不碰宏; 独占失败整条排空不落宏 (cur_skip, B=OKAY)</text>
  <text x="46" y="648" class="txt">· 宏契约: csn 低有效片选, 写 0 拍; FuSa 写 we_ecc=1 同步重算 ECC 场, bypass 写 we_ecc=0 (ECC 场留旧, 切回前重扫)</text>
</svg>
